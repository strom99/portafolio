<div id="portafolio" class="flex w-full px-4 sm:px-14 flex-col min-h-screen">
  <div class="mb-12">
    <h1 class="text-4xl font-black text-[#0A3143]">Portafolio</h1>
    <span class="text-lg font-bold text-[#276E90] mt-1"
      >Algunos de mis proyectos web</span
    >
    <p>
      Estos son algunos de mis proyectos web desde que inicie en el mundo de la
      programacion desde el 2021
    </p>
  </div>
  <div class="w-full flex flex-wrap items-center justify-center gap-14">
    <a
      *ngFor="let proyecto of proyectos"
      (click)="open(proyecto)"
      [class]=""
      (mouseenter)="efectHov($event)"
      (mouseleave)="efectHovLeav($event)"
      class="proyecto w-96 h-60 flex justify-center items-center cursor-pointer"
    >
      <img src="../../../assets/img/{{ proyecto.img }}.png" alt="" />
      <div
        class="description absolute max-w-xs text-center z-10 opacity-0 font-bold"
      >
        <h2 class="text-2xl text-[#0A3143]">{{ proyecto.titulo }}</h2>
        <span class="text-[#276E90]">{{ proyecto.tipo }}</span>
        <p class="text-base text-slate-700 mt-2">
          {{ proyecto.descripcioncorta }}
        </p>
        <span class="text-sm text-slate-500">{{ proyecto.ano }}</span>
      </div>
    </a>
  </div>
</div>
<div *ngIf="show">
  <app-proyecto [pro]="hijo" (close)="show = false"></app-proyecto>
</div>
