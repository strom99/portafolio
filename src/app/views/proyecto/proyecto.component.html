<div
  class="fixed bg-slate-100 w-full h-full z-[200] top-0 text-center overflow-auto"
>
  <header class="bg-gray-600 h-14 flex justify-end items-center pr-7">
    <button class="text-cyan-50 text-2xl font-bold" (click)="close.emit()">
      x
    </button>
  </header>
  <div class="">
    <h2 class="text-4xl font-black text-[#0A3143] m-3">{{ pro.titulo }}</h2>
    <div class="w-11/12 m-auto mt-3 mb-3">
      <img src="../../../assets/img/{{ pro.img }}.png" alt="" />
    </div>
    <div class="">
      <H4 class="text-lg font-bold text-[#276E90] mt-1">Caracteristicas</H4>
      <p>
        {{ pro.descripcion }}
      </p>
      <span>{{ pro.ano }}</span>
    </div>
  </div>
</div>
